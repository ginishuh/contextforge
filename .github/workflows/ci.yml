name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether tests are needed
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Refresh the base ref for PRs from forks or stale checkouts before
            # comparing against the merge base.
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            if git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null; then
              git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "$changed_files"
            else
              echo "No merge base found with origin/${{ github.base_ref }}; run tests defensively."
              printf '__force_tests__\n' > "$changed_files"
            fi
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [[ "$before" =~ ^0+$ ]]; then
              git diff-tree --no-commit-id --name-only -r "$after" > "$changed_files"
            else
              git diff --name-only "$before" "$after" > "$changed_files"
            fi
          fi

          run_tests="$(bash scripts/ci-detect-run-tests.sh < "$changed_files")"

          printf 'run_tests=%s\n' "$run_tests" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: Workflow lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

  source-lint:
    name: Source lint
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # The line budget ratchet compares against the base branch so a budget
      # raised anywhere in the pull request is rejected. Without this fetch the
      # base ref is absent and the comparison silently skips itself.
      - name: Fetch base branch for the line budget ratchet
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - run: npm run lint
        env:
          CONTEXTFORGE_LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}


  quality-eval:
    name: Offline quality eval
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run eval:quality

      - name: Upload quality eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-eval-report
          path: artifacts/eval/quality-report.json
          if-no-files-found: error

  release-hygiene:
    name: Release and package hygiene
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm run verify:release

      - name: Upload npm package inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-package-report
          path: artifacts/release/package-report.json
          if-no-files-found: error

  test:
    name: Test on Node ${{ matrix.node-version }}
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm test
        env:
          # Hosted runners, especially Node 24, can be materially slower while
          # individual slow-test detection still catches localized regressions.
          CONTEXTFORGE_TEST_BUDGET_MS: 180000

      - name: Upload test duration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: artifacts/test/
          if-no-files-found: error

  dependency-audit:
    name: Production dependency audit
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.changes.outputs.run-tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # npm audit reads package-lock.json directly; no install is needed for this
      # fast supply-chain gate.
      - name: Reject moderate-or-higher production advisories
        run: npm audit --omit=dev --audit-level=moderate

  ci-summary:
    name: CI Summary
    needs:
      - changes
      - workflow-lint
      - source-lint
      - quality-eval
      - release-hygiene
      - test
      - dependency-audit
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.workflow-lint.result }}" != "success" ]]; then
            echo "workflow-lint failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run-tests }}" == "true" && "${{ needs.source-lint.result }}" != "success" ]]; then
            echo "source-lint failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run-tests }}" == "true" && "${{ needs.quality-eval.result }}" != "success" ]]; then
            echo "offline quality eval failed"
            exit 1
          fi
          if [[ "${{ needs.release-hygiene.result }}" != "success" ]]; then
            echo "release and package hygiene failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run-tests }}" == "true" && "${{ needs.test.result }}" != "success" ]]; then
            echo "tests failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run-tests }}" == "true" && "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "production dependency audit failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run-tests }}" != "true" ]]; then
            echo "docs-only change: release hygiene ran; Node test matrix and production dependency audit skipped"
          fi
